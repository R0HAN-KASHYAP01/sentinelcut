[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelcut-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper",
    "rapidfuzz",
]

[tool.setuptools.packages.find]
include = ["sentinelcut_ai*"]

[tool.setuptools.package-data]
sentinelcut_ai = ["data/dictionaries/*.json", "data/embeddings/*.json"]